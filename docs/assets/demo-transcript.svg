    <text x="28" y="158" fill="#3538cd" font-size="11" font-family="Consolas,monospace">knotline_read_project_context()</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.38;0.94;1" dur="7s" repeatCount="indefinite"/>

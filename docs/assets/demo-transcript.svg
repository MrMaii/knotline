      <animate attributeName="width" values="0;300" keyTimes="0;1" dur="7s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.4 1"/>
    </rect>
    <rect x="28" y="212" width="340" height="8" rx="4" fill="#e4e7ec">
      <animate attributeName="width" values="0;0;340" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="228" width="220" height="8" rx="4" fill="#e4e7ec">
      <animate attributeName="width" values="0;0;220" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.8;0.94;1" dur="7s" repeatCount="indefinite"/>
    <rect x="28" y="256" width="504" height="44" rx="10" fill="#f0fdf4" stroke="#6ce9a6"/>
    <text x="44" y="283" fill="#067647" font-size="12" font-weight="700">✓ Agent 完整回复已存档 — 交付摘要 · 验证证据 · 全文</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="Six root node types" font-family="'PingFang SC','Microsoft YaHei',Segoe UI,sans-serif">
  <rect width="1200" height="240" rx="20" fill="#f7f8fa"/>

  <!-- Request -->
  <g transform="translate(36,50)">
    <rect width="168" height="120" rx="16" fill="#fff" stroke="#84adff"/>
    <text x="18" y="32" fill="#175cd3" font-size="11" font-weight="750" letter-spacing="1">诉求 REQUEST</text>
    <rect x="18" y="46" width="128" height="7" rx="3.5" fill="#e4e7ec"/>
    <rect x="18" y="60" width="104" height="7" rx="3.5" fill="#e4e7ec"/>
    <text x="18" y="100" fill="#98a2b3" font-size="10.5">问题 · 功能 · Debug</text>
  </g>

  <!-- Agent -->
  <g transform="translate(228,50)">
    <rect width="184" height="120" rx="44" fill="#fff" stroke="#2e90fa"/>
    <circle cx="42" cy="60" r="21" fill="#6172f3"/>
    <text x="42" y="65" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">A1</text>
    <text x="74" y="52" fill="#98a2b3" font-size="9.5" font-weight="750" letter-spacing="1.2">AGENT</text>
    <text x="74" y="72" fill="#182230" font-size="14" font-weight="700">Agent 1</text>
    <circle cx="158" cy="38" r="4.5" fill="#12b76a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="74" y="94" fill="#667085" font-size="10.5">可恢复 DSH 对话</text>
  </g>

  <!-- Skill -->
  <g transform="translate(436,50)">
    <rect width="168" height="120" rx="18" fill="#faf5ff" stroke="#b692f6"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#7f56d9"/>
    <text x="22" y="32" fill="#6941c6" font-size="11" font-weight="750" letter-spacing="1">SKILL</text>
    <text x="22" y="58" fill="#182230" font-size="13" font-weight="700">/report-skill</text>
    <text x="22" y="100" fill="#98a2b3" font-size="10.5">拖到 Agent 绑定能力</text>
  </g>

  <!-- Backlog -->
  <g transform="translate(628,50)">
    <rect width="168" height="120" rx="20" fill="#fff" stroke="#98a2b3"/>
    <rect x="0" y="0" width="168" height="8" rx="4" fill="#667085"/>
    <text x="18" y="36" fill="#344054" font-size="11" font-weight="750" letter-spacing="1">积压池 BACKLOG</text>
    <rect x="18" y="50" width="132" height="16" rx="5" fill="#f2f4f7"/>
    <rect x="18" y="72" width="132" height="16" rx="5" fill="#f2f4f7"/>
    <text x="18" y="106" fill="#98a2b3" font-size="10.5">排队 · 自动分配</text>
  </g>

  <!-- Approval -->
  <g transform="translate(820,50)">
    <rect width="168" height="120" rx="24" fill="#faf5ff" stroke="#9e77ed"/>
    <rect x="0" y="0" width="168" height="9" rx="4.5" fill="#7f56d9"/>
    <text x="18" y="37" fill="#6941c6" font-size="11" font-weight="750" letter-spacing="1">审批池 APPROVAL</text>
    <rect x="18" y="52" width="132" height="14" rx="4" fill="#fff" stroke="#e9d7fe"/>
    <rect x="24" y="72" width="132" height="14" rx="4" fill="#fff" stroke="#d6bbfb"/>
    <text x="18" y="108" fill="#98a2b3" font-size="10.5">存入待批 · 受信执行</text>
  </g>

  <!-- Scheduled -->
  <g transform="translate(1012,50)">
    <rect width="152" height="120" rx="40" fill="#fffaeb" stroke="#fdb022"/>
    <text x="22" y="34" fill="#b54708" font-size="11" font-weight="750" letter-spacing="1">定时触发</text>
    <text x="22" y="66" fill="#182230" font-size="19" font-weight="800">60<tspan font-size="11" font-weight="600" fill="#b54708"> 分钟</tspan></text>
    <rect x="22" y="80" width="108" height="2" fill="none" stroke="#fdb022" stroke-width="2" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="22" y="106" fill="#98a2b3" font-size="10.5">按频次发送 Prompt</text>
  </g>

  <text x="600" y="212" fill="#98a2b3" font-size="12" text-anchor="middle">六种根节点 · 其余一切由系统长在图上 — Six root nodes; everything else grows on the map</text>
</svg>

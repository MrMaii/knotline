<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="运筹 Knotline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101323"/>
      <stop offset="1" stop-color="#1b1e3f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6172f3"/>
      <stop offset="1" stop-color="#8098f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g opacity="0.16" fill="#8098f9">
    <circle cx="60" cy="60" r="2"/><circle cx="160" cy="40" r="2"/><circle cx="1080" cy="270" r="2"/>
    <circle cx="1140" cy="80" r="2"/><circle cx="980" cy="50" r="2"/><circle cx="120" cy="270" r="2"/>
  </g>
  <!-- The mark: three endpoints crossed by one indigo signal path -->
  <g transform="translate(120,160)">
    <path id="line" d="M 0 60 C 90 60 120 -60 220 -60 C 320 -60 350 60 440 60"
      fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="60" r="14" fill="#101323" stroke="#8098f9" stroke-width="5"/>
    <circle cx="220" cy="-60" r="14" fill="#101323" stroke="#8098f9" stroke-width="5"/>
    <circle cx="440" cy="60" r="14" fill="#101323" stroke="#8098f9" stroke-width="5"/>
    <circle cx="220" cy="-60" r="24" fill="none" stroke="#6172f3" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(680,132)">
    <text x="0" y="0" fill="#ffffff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="76" font-weight="700" letter-spacing="6">运筹</text>
    <text x="180" y="0" fill="#8098f9" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700" letter-spacing="1">Knotline</text>
    <text x="2" y="46" fill="#b3b8db" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">一张图统筹 Agent：连线即执行</text>
    <text x="2" y="82" fill="#7a80a8" font-family="Inter,Segoe UI,sans-serif" font-size="15" letter-spacing="0.5">Plan, execute, and review real agent work on one operating map.</text>
  </g>
</svg>
